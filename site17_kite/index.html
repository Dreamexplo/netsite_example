<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>林澈 · 创意技术工程师 | 放纸鸢</title>
<style>
:root{
  --acc:#e8543f; --acc2:#ffd9a0; --sky1:#7db8e8; --sky2:#cfe8f8;
  --ink:#2c3a4a; --muted:#5a7a94; --line:rgba(44,58,74,.2);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#cfe8f8;color:var(--ink);overflow:hidden;
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;user-select:none}
canvas#bg{position:fixed;inset:0;display:block;z-index:0;background:#cfe8f8;cursor:crosshair;touch-action:none}

#nav{position:fixed;top:0;left:0;right:0;z-index:22;display:flex;align-items:center;justify-content:space-between;padding:13px 26px;pointer-events:auto}
#logo{font-weight:800;letter-spacing:.16em;font-size:14px;display:flex;align-items:center;gap:10px;color:var(--ink)}
#logo i{width:9px;height:9px;border-radius:50%;background:var(--acc);display:inline-block;animation:pulse 2.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
#logo small{font-weight:400;letter-spacing:.06em;color:var(--muted);font-size:11px}
#nav ul{display:flex;gap:20px;list-style:none}
#nav a{color:var(--muted);text-decoration:none;font-size:12.5px;letter-spacing:.1em;cursor:pointer;transition:.25s;padding:5px 2px;border-bottom:1px solid transparent;text-shadow:0 1px 4px rgba(255,255,255,.7)}
#nav a:hover,#nav a.active{color:var(--acc);border-bottom-color:var(--acc)}
@media(max-width:820px){#nav ul{gap:12px}#nav a{font-size:11px}#logo small{display:none}}

.tag{position:fixed;z-index:12;width:120px;margin-left:-60px;cursor:pointer;text-align:center;transition:transform .3s;will-change:transform}
.tag:hover{transform:scale(1.12)}
.tag svg{display:block;margin:0 auto;filter:drop-shadow(0 6px 10px rgba(40,80,120,.25))}
.tag .lbl{margin-top:-40px;font-size:14px;font-weight:700;color:#fff;letter-spacing:.2em;text-shadow:0 1px 6px rgba(40,60,90,.65);pointer-events:none}
.tag.done .lbl{color:var(--acc2)}

#panel{position:fixed;z-index:30;left:50%;top:50%;width:min(620px,88vw);transform:translate(-50%,-46%) scale(.9);opacity:0;pointer-events:none;
  transition:transform .4s cubic-bezier(.2,.9,.3,1.2),opacity .35s}
#panel.open{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
#panel .pn-in{position:relative;padding:28px 32px 30px;background:linear-gradient(170deg,#fffdf6,#faf3e2);
  border:1px solid rgba(160,120,60,.35);border-radius:4px;box-shadow:0 30px 70px rgba(40,60,90,.35)}
#panel .pn-in::before{content:"";position:absolute;inset:7px;border:1px dashed rgba(160,120,60,.3);pointer-events:none}
#panel h3{font-size:22px;color:var(--acc);margin-bottom:4px;letter-spacing:.1em}
#panel .en{font-size:11px;letter-spacing:.26em;color:var(--muted);margin-bottom:14px}
#panel .body{font-size:14.5px;line-height:1.95;color:var(--ink)}
#panel .body b{color:var(--acc)}
#panel .close{position:absolute;top:12px;right:14px;width:32px;height:32px;border:none;border-radius:50%;background:rgba(44,58,74,.08);color:var(--ink);font-size:16px;cursor:pointer;transition:.2s}
#panel .close:hover{background:var(--acc);color:#fff}
.skill{margin:6px 0 12px}
.skill .nm{display:flex;justify-content:space-between;font-size:13px}
.skill .nm em{font-style:normal;color:var(--muted);font-size:11px}
.skill .bar{height:5px;background:rgba(44,58,74,.12);border-radius:3px;overflow:hidden;margin-top:4px}
.skill .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:3px}
.work{margin-bottom:14px;padding-left:12px;border-left:3px solid var(--acc)}
.work h5{font-size:14.5px;margin-bottom:2px}
.work p{font-size:12px;color:var(--muted);line-height:1.7}
.tl{list-style:none}
.tl li{position:relative;padding:0 0 14px 18px;border-left:1px solid var(--line)}
.tl li::before{content:"";position:absolute;left:-4px;top:4px;width:7px;height:7px;border-radius:50%;background:var(--acc)}
.tl time{font-size:11px;color:var(--acc)}
.tl h6{font-size:14px;margin:2px 0 2px}
.tl p{font-size:12px;color:var(--muted);line-height:1.65}
.contact a{display:inline-block;margin:6px 8px 0 0;padding:7px 14px;border:1px solid var(--line);border-radius:2px;font-size:13px;color:var(--ink);text-decoration:none;transition:.2s}
.contact a:hover{background:var(--acc);color:#fff;border-color:var(--acc)}

#hud{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:flex-end;justify-content:space-between;padding:14px 26px;pointer-events:none}
#gauge{display:flex;gap:26px;align-items:baseline;background:rgba(255,255,255,.55);backdrop-filter:blur(4px);padding:10px 18px;border-radius:12px;border:1px solid rgba(255,255,255,.7)}
#gauge .g{display:flex;flex-direction:column;min-width:44px}
#gauge b{font-size:22px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
#gauge span{font-size:9.5px;letter-spacing:.2em;color:var(--muted)}
#hudR{text-align:right;font-size:10.5px;color:var(--muted);line-height:1.8;background:rgba(255,255,255,.55);backdrop-filter:blur(4px);padding:8px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.7)}
#hudR b{color:var(--acc);font-weight:600}
#tip{position:fixed;z-index:26;pointer-events:none;padding:6px 12px;font-size:11.5px;background:rgba(255,255,255,.92);border:1px solid rgba(232,84,63,.5);color:var(--acc);border-radius:20px;opacity:0;transform:translate(14px,14px);white-space:nowrap;box-shadow:0 4px 12px rgba(40,60,90,.2)}
#toast{position:fixed;z-index:28;left:50%;top:76px;transform:translateX(-50%);padding:8px 20px;background:rgba(44,58,74,.85);color:#fff;font-size:12.5px;letter-spacing:.1em;border-radius:20px;opacity:0;transition:opacity .4s;pointer-events:none}
#loader{position:fixed;inset:0;z-index:60;background:#cfe8f8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .8s}
#loader .t{font-size:24px;font-weight:700;color:var(--ink);letter-spacing:.34em}
#loader .b{width:190px;height:3px;background:rgba(44,58,74,.15);border-radius:2px}
#loader .b i{display:block;height:100%;width:0;background:var(--acc);border-radius:2px;transition:width .3s}
#loader.gone{opacity:0;visibility:hidden;pointer-events:none}
</style>
</head>
<body>
<canvas id="bg"></canvas>

<nav id="nav">
  <div id="logo"><i></i>林澈 <small>CREATIVE TECHNOLOGIST</small></div>
  <ul>
    <li><a data-k="about">关于</a></li>
    <li><a data-k="skills">技艺</a></li>
    <li><a data-k="works">作品</a></li>
    <li><a data-k="journey">经历</a></li>
    <li><a data-k="contact">联络</a></li>
  </ul>
</nav>

<div class="tag" data-k="about"   style="left:16%;top:22%"><svg width="84" height="96" viewBox="0 0 84 96"><g stroke="#c94a36" stroke-width="2" fill="#ff8a70" fill-opacity=".9"><path d="M42 6 L72 46 L42 90 L12 46 Z"/><path d="M42 6 L42 90 M12 46 L72 46" stroke="#fff" stroke-opacity=".7"/></g><circle cx="42" cy="90" r="3" fill="#c94a36"/></svg><div class="lbl">关于</div></div>
<div class="tag" data-k="skills"  style="left:38%;top:13%"><svg width="84" height="96" viewBox="0 0 84 96"><g stroke="#3a8ac0" stroke-width="2" fill="#7ec3ec" fill-opacity=".9"><path d="M42 6 L72 46 L42 90 L12 46 Z"/><path d="M42 6 L42 90 M12 46 L72 46" stroke="#fff" stroke-opacity=".7"/></g><circle cx="42" cy="90" r="3" fill="#3a8ac0"/></svg><div class="lbl">技艺</div></div>
<div class="tag" data-k="works"   style="left:62%;top:24%"><svg width="84" height="96" viewBox="0 0 84 96"><g stroke="#c9a13a" stroke-width="2" fill="#ffd9a0" fill-opacity=".95"><path d="M42 6 L72 46 L42 90 L12 46 Z"/><path d="M42 6 L42 90 M12 46 L72 46" stroke="#fff" stroke-opacity=".7"/></g><circle cx="42" cy="90" r="3" fill="#c9a13a"/></svg><div class="lbl">作品</div></div>
<div class="tag" data-k="journey" style="left:80%;top:15%"><svg width="84" height="96" viewBox="0 0 84 96"><g stroke="#5aa86a" stroke-width="2" fill="#8fd8a0" fill-opacity=".9"><path d="M42 6 L72 46 L42 90 L12 46 Z"/><path d="M42 6 L42 90 M12 46 L72 46" stroke="#fff" stroke-opacity=".7"/></g><circle cx="42" cy="90" r="3" fill="#5aa86a"/></svg><div class="lbl">经历</div></div>
<div class="tag" data-k="contact" style="left:50%;top:36%"><svg width="84" height="96" viewBox="0 0 84 96"><g stroke="#9a6ac0" stroke-width="2" fill="#c8a8ec" fill-opacity=".9"><path d="M42 6 L72 46 L42 90 L12 46 Z"/><path d="M42 6 L42 90 M12 46 L72 46" stroke="#fff" stroke-opacity=".7"/></g><circle cx="42" cy="90" r="3" fill="#9a6ac0"/></svg><div class="lbl">联络</div></div>

<div id="panel">
  <div class="pn-in"><button class="close" id="pnClose">✕</button><div id="pnBody"></div></div>
</div>

<div id="hud">
  <div id="gauge">
    <div class="g"><b id="gAlt">0</b><span>高度 M</span></div>
    <div class="g"><b id="gLen">0</b><span>线长 M</span></div>
    <div class="g"><b id="gWind">3</b><span>风力 级</span></div>
  </div>
  <div id="hudR">
    <div><b>移动鼠标</b> 牵引纸鸢 · <b>滚轮</b> 收放线</div>
    <div><b>点击空中纸鸢</b> 展开信笺 · <b>ESC</b> 收起</div>
  </div>
</div>

<div id="tip"></div>
<div id="toast"></div>
<div id="loader"><div class="t">放 纸 鸢</div><div class="b"><i id="ldbar"></i></div></div>

<script>
(function(){
"use strict";
var cv = document.getElementById('bg'), ctx = cv.getContext('2d');
var W, H, DPR = Math.min(devicePixelRatio||1, 2);
function resize(){
  W = cv.width = innerWidth*DPR; H = cv.height = innerHeight*DPR;
  cv.style.width = innerWidth+'px'; cv.style.height = innerHeight+'px';
}
resize(); addEventListener('resize', resize);
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function rnd(a,b){ return a+Math.random()*(b-a); }

/* ---------- 云 ---------- */
var clouds = [];
for(var i=0;i<10;i++) clouds.push({x:Math.random(), y:rnd(0.05,0.42), s:rnd(0.5,1.4), sp:rnd(0.004,0.012), o:rnd(0.5,0.9)});
function drawCloud(x,y,s,o){
  ctx.fillStyle='rgba(255,255,255,'+o+')';
  ctx.beginPath();
  ctx.arc(x,y,34*s,0,6.2832);
  ctx.arc(x+30*s,y-12*s,26*s,0,6.2832);
  ctx.arc(x+62*s,y,30*s,0,6.2832);
  ctx.arc(x+30*s,y+10*s,30*s,0,6.2832);
  ctx.fill();
}

/* ---------- 鸟群 ---------- */
var birds = [];
for(i=0;i<5;i++) birds.push({x:Math.random(), y:rnd(0.1,0.3), sp:rnd(0.006,0.016), ph:rnd(0,6.28), gap:rnd(18,30)});
function drawBird(x,y,flap){
  ctx.strokeStyle='rgba(40,50,70,.75)'; ctx.lineWidth=2.4; ctx.lineCap='round';
  var f = Math.sin(flap)*8;
  ctx.beginPath(); ctx.moveTo(x-10,y+f); ctx.quadraticCurveTo(x-4,y-2,x,y);
  ctx.quadraticCurveTo(x+4,y-2,x+10,y-f); ctx.stroke();
}

/* ---------- 热气球 ---------- */
var balloons = [
  {x:0.14, y:0.12, c:['#e8543f','#f2a05a'], ph:0},
  {x:0.9, y:0.2, c:['#4a90c0','#8ac0e0'], ph:2}
];
function drawBalloon(b, t){
  var x=b.x*innerWidth, y=b.y*innerHeight + Math.sin(t*0.6+b.ph)*8;
  var g=ctx.createLinearGradient(x-20,y-30,x+20,y+40);
  g.addColorStop(0,b.c[0]); g.addColorStop(1,b.c[1]);
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.ellipse(x,y,22,30,0,0,6.2832); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(x-22,y+8); ctx.quadraticCurveTo(x,y+2,x+22,y+8); ctx.stroke();
  ctx.fillStyle='rgba(90,70,50,.9)';
  ctx.fillRect(x-9,y+30,18,12);
  ctx.strokeStyle='rgba(60,50,40,.7)';
  ctx.beginPath(); ctx.moveTo(x-9,y+30); ctx.lineTo(x-14,y+44); ctx.moveTo(x+9,y+30); ctx.lineTo(x+14,y+44); ctx.stroke();
}

/* ---------- 风絮 ---------- */
var motes = [];
for(i=0;i<70;i++) motes.push({x:Math.random(), y:Math.random(), sp:rnd(0.02,0.06), ph:rnd(0,6.28), s:rnd(1.5,3.5)});

/* ---------- 草地花 ---------- */
var flowers = [];
for(i=0;i<26;i++) flowers.push({x:Math.random(), y:rnd(0.78,0.98), c:['#fff','#ffd9a0','#ff8a70','#c8a8ec','#ff6f9c'][i%5]});

/* ---------- 玩家风筝（沙燕） ---------- */
var kite = {x:0.5, y:0.45, vx:0, vy:0, tx:0.5, ty:0.4, tilt:0};
var hand = {x:0.5, y:1.0};
var lineLen = 0.75;
var windT = 0;
var mouse = {x:0.5, y:0.45, moved:false};
var tail = [];
for(i=0;i<11;i++) tail.push({x:0, y:0});

function drawKite(x, y, s, tilt){
  ctx.save(); ctx.translate(x,y); ctx.rotate(tilt); ctx.scale(s,s);
  // 翅膀（两侧展开）
  var g = ctx.createLinearGradient(-46,-8,46,8);
  g.addColorStop(0,'#ffb08a'); g.addColorStop(1,'#e8543f');
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.moveTo(0,-30); ctx.lineTo(-46,4); ctx.lineTo(0,-4); ctx.lineTo(46,4); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=1.5; ctx.stroke();
  // 身体（菱形）
  var b = ctx.createLinearGradient(0,-34,0,52);
  b.addColorStop(0,'#ff6a50'); b.addColorStop(1,'#c94030');
  ctx.fillStyle=b;
  ctx.beginPath(); ctx.moveTo(0,-34); ctx.lineTo(16,0); ctx.lineTo(0,52); ctx.lineTo(-16,0); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.6)'; ctx.stroke();
  // 眼睛
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(-7,-12,4.5,0,6.2832); ctx.arc(7,-12,4.5,0,6.2832); ctx.fill();
  ctx.fillStyle='#2c3a4a';
  ctx.beginPath(); ctx.arc(-7,-12,2,0,6.2832); ctx.arc(7,-12,2,0,6.2832); ctx.fill();
  // 尾巴两根
  ctx.strokeStyle='#e8543f'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.moveTo(0,52); ctx.lineTo(0,84); ctx.moveTo(0,52); ctx.lineTo(6,80); ctx.stroke();
  ctx.restore();
}

var PANELS = {
  about: '<h3>关于 · 林澈</h3><div class="en">ABOUT / CREATIVE TECHNOLOGIST</div>'+
    '<div class="body"><p>我是<b>林澈</b>，创意技术工程师。风筝飞得高，是因为有一根线牵着——我做的东西也是这样：<b>想象力在云端，工程在地上。</b></p>'+
    '<p style="margin-top:10px">六年里我放起过火山、黑洞、鲸、车马，今天这只纸鸢，是给"玩心"留的一根线。</p></div>',
  skills: '<h3>技艺 · 六艺</h3><div class="en">SKILLS</div><div class="body">'+
    '<div class="skill"><div class="nm">WebGL / Three.js <em>95</em></div><div class="bar"><i style="width:95%"></i></div></div>'+
    '<div class="skill"><div class="nm">GLSL 着色器 <em>86</em></div><div class="bar"><i style="width:86%"></i></div></div>'+
    '<div class="skill"><div class="nm">TypeScript / Vite <em>90</em></div><div class="bar"><i style="width:90%"></i></div></div>'+
    '<div class="skill"><div class="nm">程序化建模 <em>82</em></div><div class="bar"><i style="width:82%"></i></div></div>'+
    '<div class="skill"><div class="nm">动效叙事 <em>85</em></div><div class="bar"><i style="width:85%"></i></div></div></div>',
  works: '<h3>作品 · 三只纸鸢</h3><div class="en">SELECTED WORKS</div><div class="body">'+
    '<div class="work"><h5>《长明火》实时火山模拟</h5><p>GPU 粒子热对流近似，四十万颗粒子稳定 60fps。</p></div>'+
    '<div class="work"><h5>《视界之外》引力透镜可视化</h5><p>raymarching 求解光线偏折，把黑洞做成可行走的场景。</p></div>'+
    '<div class="work"><h5>《九驾》西周车马复原</h5><p>按考古报告重建车马器比例，知识做进交互里。</p></div></div>',
  journey: '<h3>经历 · 风筝线</h3><div class="en">JOURNEY</div><div class="body"><ul class="tl">'+
    '<li><time>2023 — 至今</time><h6>独立创意技术</h6><p>为品牌与美术馆做实时图形装置。</p></li>'+
    '<li><time>2020 — 2023</time><h6>互娱科技 · 高级前端</h6><p>渲染管线、性能与动效体系。</p></li>'+
    '<li><time>2018 — 2020</time><h6>数字工作室 · 交互开发</h6><p>线下装置与机构控制。</p></li></ul></div>',
  contact: '<h3>联络 · 交个朋友</h3><div class="en">CONTACT</div><div class="body contact"><p>想一起放一只更大的风筝？线在这——</p>'+
    '<a href="mailto:hello@linche.studio">✉ hello@linche.studio</a><a>GitHub / linche</a><a>微信 / linche_dev</a></div>'
};
var panel = document.getElementById('panel');
var pnBody = document.getElementById('pnBody');
var activeK = null;
var toastEl = document.getElementById('toast');
var toastT = 0;
function toast(msg){ toastEl.textContent=msg; toastEl.style.opacity=1; toastT=2.4; }
function openPanel(k){
  activeK=k; pnBody.innerHTML=PANELS[k]||''; panel.classList.add('open');
  document.querySelectorAll('.tag').forEach(function(el){ el.classList.toggle('done', el.dataset.k===k); });
  toast('信笺展开 · '+({about:'关于',skills:'技艺',works:'作品',journey:'经历',contact:'联络'})[k]);
}
function closePanel(){ activeK=null; panel.classList.remove('open'); document.querySelectorAll('.tag').forEach(function(el){ el.classList.remove('done'); }); }
document.getElementById('pnClose').onclick = closePanel;
addEventListener('keydown', function(e){ if(e.key==='Escape') closePanel(); });
document.querySelectorAll('.tag').forEach(function(el){
  el.addEventListener('click', function(ev){
    ev.stopPropagation();
    var k = el.dataset.k;
    if(activeK===k){ closePanel(); return; }
    var r = el.getBoundingClientRect();
    kite.tx = (r.left+r.width/2)/innerWidth;
    kite.ty = clamp((r.top+r.height/2)/innerHeight, 0.1, 0.6);
    openPanel(k);
  });
});
document.querySelectorAll('#nav a').forEach(function(a){
  a.addEventListener('click', function(){ var el=document.querySelector('.tag[data-k="'+a.dataset.k+'"]'); if(el) el.click(); });
});

var dragging = false;
addEventListener('pointermove', function(e){
  mouse.x=e.clientX/innerWidth; mouse.y=e.clientY/innerHeight; mouse.moved=true;
  if(!dragging){ kite.tx=clamp(mouse.x,0.06,0.94); kite.ty=clamp(mouse.y,0.08,0.78); }
});
addEventListener('pointerdown', function(e){
  if(e.target.closest('.tag')||e.target.closest('#panel')||e.target.closest('#nav')) return;
  dragging=true; kite.tx=clamp(e.clientX/innerWidth,0.06,0.94); kite.ty=clamp(e.clientY/innerHeight,0.08,0.78);
});
addEventListener('pointerup', function(){ dragging=false; });
addEventListener('wheel', function(e){ lineLen = clamp(lineLen + (e.deltaY>0?0.04:-0.04), 0.3, 1.6); }, {passive:true});

var start = performance.now();
var windLevel = 3;
function loop(){
  requestAnimationFrame(loop);
  var t = (performance.now()-start)/1000;
  windT = t;
  windLevel = 2 + Math.round(1.5 + Math.sin(t*0.23)*1.4);
  var windF = windLevel/4;
  var w = innerWidth, h = innerHeight;

  /* 天空 */
  var sky = ctx.createLinearGradient(0,0,0,h);
  sky.addColorStop(0,'#5fa8e0'); sky.addColorStop(0.55,'#a8d4f2'); sky.addColorStop(1,'#dff0fa');
  ctx.fillStyle=sky; ctx.fillRect(0,0,w,h);

  /* 太阳 + 光晕 */
  ctx.fillStyle='rgba(255,240,200,.95)';
  ctx.beginPath(); ctx.arc(w*0.87, h*0.12, 32, 0, 6.2832); ctx.fill();
  var halo = ctx.createRadialGradient(w*0.87,h*0.12,20,w*0.87,h*0.12,90);
  halo.addColorStop(0,'rgba(255,240,200,.5)'); halo.addColorStop(1,'rgba(255,240,200,0)');
  ctx.fillStyle=halo; ctx.beginPath(); ctx.arc(w*0.87,h*0.12,90,0,6.2832); ctx.fill();

  /* 热气球 */
  for(var bi=0;bi<balloons.length;bi++) drawBalloon(balloons[bi], t);

  /* 云 */
  for(var i=0;i<clouds.length;i++){
    var c=clouds[i];
    c.x += c.sp*(0.4+windF*0.8)*0.001;
    if(c.x>1.15) c.x=-0.18;
    drawCloud(c.x*w, c.y*h, c.s, c.o*0.85);
  }

  /* 鸟群 */
  for(i=0;i<birds.length;i++){
    var b=birds[i];
    b.x += b.sp*(0.4+windF)*0.01;
    if(b.x>1.1) b.x=-0.1;
    var by = b.y*h + Math.sin(t*0.8+b.ph)*10;
    drawBird(b.x*w - birds.indexOf(b)*b.gap, by, t*6+b.ph);
  }

  /* 远山 */
  ctx.fillStyle='rgba(120,170,150,.4)';
  ctx.beginPath(); ctx.moveTo(0,h*0.72);
  for(i=0;i<=8;i++){ var mx=i/8*w, mh=(i%2?0.06:0.1)*h; ctx.quadraticCurveTo(mx+w/16, h*0.72-mh, mx+w/8, h*0.72); }
  ctx.lineTo(w,h); ctx.lineTo(0,h); ctx.fill();

  /* 草地 */
  var gr = ctx.createLinearGradient(0,h*0.74,0,h);
  gr.addColorStop(0,'#7ab86a'); gr.addColorStop(1,'#46883e');
  ctx.fillStyle=gr;
  ctx.beginPath(); ctx.moveTo(0,h*0.76);
  ctx.quadraticCurveTo(w*0.3,h*0.73, w*0.55,h*0.77);
  ctx.quadraticCurveTo(w*0.8,h*0.80, w,h*0.75);
  ctx.lineTo(w,h); ctx.lineTo(0,h); ctx.fill();
  /* 草叶 */
  ctx.strokeStyle='rgba(50,110,50,.4)'; ctx.lineWidth=1.4;
  for(i=0;i<50;i++){
    var gx=(i/50)*w + Math.sin(i*7.3)*8, gy=h*0.78 + Math.sin(i*3.1)*h*0.06;
    var sway=Math.sin(t*2+i)*3*(0.5+windF);
    ctx.beginPath(); ctx.moveTo(gx,gy); ctx.quadraticCurveTo(gx+sway,gy-8,gx+sway*1.8,gy-14); ctx.stroke();
  }
  /* 小花 */
  for(i=0;i<flowers.length;i++){
    var fl=flowers[i];
    ctx.fillStyle=fl.c;
    ctx.beginPath(); ctx.arc(fl.x*w, fl.y*h + Math.sin(t+fl.x*20)*2, 3.2, 0, 6.2832); ctx.fill();
    ctx.fillStyle='#f2d060';
    ctx.beginPath(); ctx.arc(fl.x*w, fl.y*h + Math.sin(t+fl.x*20)*2, 1.3, 0, 6.2832); ctx.fill();
  }

  /* 风絮 */
  ctx.fillStyle='rgba(255,255,255,.5)';
  for(i=0;i<motes.length;i++){
    var m=motes[i];
    m.x += m.sp*(0.3+windF)*0.01;
    if(m.x>1.05){ m.x=-0.05; m.y=Math.random(); }
    var my=m.y*h + Math.sin(t*1.4+m.ph)*14;
    ctx.beginPath(); ctx.arc(m.x*w, my, m.s, 0, 6.2832); ctx.fill();
  }

  /* 风筝物理 */
  var gust = Math.sin(t*0.9)*0.35 + Math.sin(t*2.3)*0.12;
  var tgx = kite.tx + gust*0.05*windF;
  var tgy = kite.ty + Math.sin(t*1.7)*0.02*windF;
  var dx0=(tgx-hand.x)*w, dy0=(tgy-hand.y)*h;
  var d0=Math.sqrt(dx0*dx0+dy0*dy0);
  var maxD=lineLen*Math.min(w,h)*1.05;
  if(d0>maxD){ tgx=hand.x+dx0/d0*maxD/w; tgy=hand.y+dy0/d0*maxD/h; }
  kite.vx=lerp(kite.vx,(tgx-kite.x)*6,0.08);
  kite.vy=lerp(kite.vy,(tgy-kite.y)*6,0.08);
  kite.x += kite.vx*0.016; kite.y += kite.vy*0.016;
  kite.x += Math.sin(t*2.1)*0.0018*windF;
  kite.y += Math.cos(t*1.6)*0.0012*windF;
  kite.tilt = clamp(kite.vx*1.4 + Math.sin(t*1.8)*0.06*windF, -0.7, 0.7);

  var kx=kite.x*w, ky=kite.y*h;
  var hx=hand.x*w, hy=hand.y*h;

  /* 风筝线（多段弯曲） */
  var seg=5, lx=hx, ly=hy;
  ctx.strokeStyle='rgba(60,60,70,.55)'; ctx.lineWidth=1.2; ctx.lineCap='round';
  for(i=1;i<=seg;i++){
    var tt=i/seg;
    var nx=hx+(kx-hx)*tt;
    var ny=hy+(ky-hy)*tt;
    // 下垂 + 风摆
    var sag = Math.sin(tt*Math.PI)*40*(1+lineLen*0.5);
    var swayL = Math.sin(t*1.2+tt*3)*6*windF;
    var cx2=(lx+nx)/2 + swayL, cy2=(ly+ny)/2 + sag;
    ctx.beginPath(); ctx.moveTo(lx,ly); ctx.quadraticCurveTo(cx2,cy2,nx,ny); ctx.stroke();
    lx=nx; ly=ny;
  }

  /* 尾穗 */
  var px=kx, py=ky+70;
  for(i=0;i<tail.length;i++){
    var tt2=tail[i];
    tt2.x=lerp(tt2.x, px + Math.sin(t*3+i*0.9)*12*(0.5+windF), 0.35);
    tt2.y=lerp(tt2.y, py+18, 0.4);
    px=tt2.x; py=tt2.y;
    ctx.fillStyle = i%2 ? 'rgba(232,84,63,.8)' : 'rgba(255,217,160,.9)';
    ctx.beginPath(); ctx.arc(tt2.x, tt2.y, 4.5-i*0.3, 0, 6.2832); ctx.fill();
  }

  /* 玩家风筝 */
  drawKite(kx, ky, 1, kite.tilt);

  /* 牵鸢人 */
  var figX=hx, figY=h*0.965;
  ctx.fillStyle='rgba(44,58,74,.85)';
  ctx.beginPath(); ctx.arc(figX, figY-h*0.055, 9, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.moveTo(figX-8,figY+h*0.035); ctx.lineTo(figX+8,figY+h*0.035); ctx.lineTo(figX+5,figY-h*0.038); ctx.lineTo(figX-5,figY-h*0.038); ctx.closePath(); ctx.fill();
  var ax=figX+(kx-figX)*0.06, ay=figY-h*0.07;
  ctx.strokeStyle='rgba(44,58,74,.85)'; ctx.lineWidth=4; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(figX,figY-h*0.032); ctx.lineTo(ax,ay); ctx.stroke();

  /* HUD（更稳定的数值） */
  var altM = Math.max(0, Math.round((1.0 - kite.y) * 120));
  var dxp=(kx-hx)/w, dyp=(ky-hy)/h;
  var lenM = Math.round(Math.sqrt(dxp*dxp+dyp*dyp) * 80);
  document.getElementById('gAlt').textContent = altM;
  document.getElementById('gLen').textContent = lenM;
  document.getElementById('gWind').textContent = windLevel;

  if(toastT>0){ toastT-=0.016; if(toastT<=0) toastEl.style.opacity=0; }
}
loop();
setTimeout(function(){
  document.getElementById('ldbar').style.width='100%';
  setTimeout(function(){ document.getElementById('loader').classList.add('gone'); }, 300);
  toast('移动鼠标，牵起你的纸鸢');
}, 500);
})();
</script>
</body>
